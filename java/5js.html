<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script>
        function rev(){
            var s = document.getElementById("txt51").value;
            var arr = s.split(" ");
            var i , kq = "";
            for(i = arr.length - 1; i >= 0;i--)
                kq += arr[i].trim() + " ";
            document.getElementById("txt51").value = kq.trim();
        }
        function normal(){
            var s = document.getElementById("txt51").value;
            arr = s.split(" ");
            var i , kq = "",tmp;
            for(i = 0;i < arr.length;i++){
                tmp = arr[i].trim().tolowercase();
                if(tmp != ""){
                    tmp = tmp.substr(0,1).touppercase() + tmp.substr(1);
                    kq += tmp + " ";
                }
            }
            document.getElementById("txt51").value = kq.trim();
        }
    </script>
</head>

</html>
