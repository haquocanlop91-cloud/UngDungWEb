<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script>
        function TaoMang(){
            var i;
            var n = parseInt(document.getElementById("sort").value);
            arr = new Array(n)
            for(i = 0; i < n;i++){
                arr[i] = Math.floor(Math.random() * 100 % 50);
            }
            document.getElementById("txtArr1").value = arr.join(" ");
        }
        function tang(a,b){
            return a - b;
        }
        function MangTang(){
             arr.sort(tang);
             document.getElementById("txtArr2").value = arr.join(" ");
        }
        function Giam(a,b){
            return b - a;
        }
        function MangGiam(){
            arr.sort(Giam);
            document.getElementById("txtArr3").value = arr.join(" ");
        }
    </script>
</head>
<body>
    <label for="sort">Nhap so phan tu</label>
    <input type="number" id="sort" value="10" size = "10"><br/>
    <button onclick="TaoMang()">Tao MAng</button>
    <button onclick="MangTang()">MAng tang</button>
    <button onclick="MangGiam()">Mang Giam</button> <br>
    <label for="txtArr1">MAng ban dau</label>
    <input type="text" id="txtArr1" size="50">
    <br>
    <label for="txtArr2">MAng Tang dan</label>
    <input type="text" id="txtArr2" size="50">
    <br>
    <label for="txtArr3">MAng Giam dan</label>
    <input type="text" id="txtArr3" size="50">
</body>
</html>
