<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <style>
        body{
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: Arial, Helvetica, sans-serif;
        }
        .div1{
            display: flex;
            background-color: rgb(185, 184, 184);
            width: fit-content;
            justify-content: center;
            align-items: center;
        }
        .div1 > div{
            color: rgb(255, 255, 255);
            font-size: 40px;
            width: 70px;
            height: 50px;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            font-weight: bold;
        }
    </style>
    <script>
        $(document).ready(function(){
            $(".div1 > div").mouseenter(function(){
                $(this).css({"background": "radial-gradient(circle at center, #f0f0f0 ,#999 )",
                    "color" : "black"
                });
                $(this).animate({
                    "width" : "120px","height":"60px",
                    "font-size" : "70px"
                }, 300);
            });
            $(".div1 > div").mouseleave(function(){
                $(this).animate({
                    "width" : "70px", "height":"50px", "font-size" : "45px"
                },300);
                $(this).css({"background" : "", "color" :""});
            });
        });
    </script>
</head>
<body>
    <div class="div1">
        <div>1</div>
        <div>2</div>
        <div>3</div>
        <div>4</div>
        <div>5</div>
    </div>
</body>
</html>
