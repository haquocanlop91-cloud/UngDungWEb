<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script>
        function Tinh(){
            var F = new Date($("#f").val());
            var L = new Date($("#l").val());
            var kq = 0;
            if(!isNaN(L) && !isNaN(F)){
                kq = ((L - F) / (1000 * 24 * 60 * 60));
                $("#p").html("So Ngay la " + kq);
            }
            else
                alert("hi");
        }
    </script>
</head>
<body>
    <div>
        <h2>Tinh So Ngay Tai 2 Thoi Diem</h2>
        <label>Tu Ngay: </label>
        <input type="date" id="f" value="2026-08-07"><br>
        <label>Den Ngay: </label>
        <input type="date" id="l" value="2026-09-08"><br>
        <button onclick="Tinh()">Tinh so Ngay</button>
        <p id="p"></p>
    </div>

</body>
</html>
