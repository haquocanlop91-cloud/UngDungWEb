<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script>
        $(document).ready(function(){
            $("img").mouseenter(function(){
                $(this).animate({width: "400px", height: "400px"}, 500)
            });

            $("img").mouseleave(function(){
                $(this).animate({
                    width:"100px", height:"50px"
                }, 500)
            });
            $("img").mouseenter(function(){
                $(this).attr("src","../images/1.jpg");
            });
            $("img").mouseleave(function(){
                $(this).attr("src", "../images/banhbao.jpg");
            });
        });
    </script>
</head>
<body>
    <div style="border: 2px solid blue; width: 400px;height: 400px;">
        <img src="../images/banhbao.jpg" alt="xzx" width="100" height="50">
    </div>
    <div class="div2" style="background-color: red;width: 50px;height: 50px;">

    </div>
</body>
</html>
