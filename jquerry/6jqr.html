<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <style>
        .div1{
            background:linear-gradient(#3c3535,#8b7c7c);
            box-shadow: 1px 1px 20px gray;
            width: 200px;
            margin-top: 20px;
            border-radius: 10px;
            padding: 10px;
            position: absolute;
        }
        .rl{
            display: flex;
            justify-content: center;
            gap: 50px;
            margin: 10px 0 10px;
        }
        .but{
            display: flex;
            margin: auto;
        }
        button{
            width: 30px;
            height: 30px;
            justify-content: center;
            text-align: center;
            display: flex;
            align-items: center;
            border-radius: 10px;
            border: none;
            color: white;
            background: linear-gradient(90deg,#0615e5,#05f2f2);
        }
        button:active{
            border: 2px solid white;
            box-shadow: 1px 1px 20px white;
            transform: scale(1.1);
            transition: all 0.000001s ease;
        }
    </style>
    <script>
        $(document).ready(function(){
            var x = 0,y = 0;
            $(".but").eq(2).click(function(){
                x += 40;
                $(".div0").css({"transform" : "translate("+ x + "px, "+ y +"px)",
                                "transition" : "transform 0.5s"
                });
            });
            $(".but").eq(1).click(function(){
                x -= 40;
                $(".div0").css({"transform" : "translate("+ x + "px,"+ y + "px)",
                                "transition" : "transform 0.5s"
                });
            });
            $(".but").eq(0).click(function(){
                y -= 40;
                $(".div0").css({"transform" : "translate("+x  +"px,"+ y + "px)",
                                "transition" : "transform 0.5s"
                });
            });
            $(".but").eq(3).click(function(){
                y += 40;
                $(".div0").css({"transform" : "translate("+ x +"px,"+ y + "px)",
                                "transition" : "transform 0.5s"
                });
            });
            $(document).keydown(function(event){
                if(event.key == "d")
                    x += 40;
                if(event.key == "a")
                    x -=40;
                if(event.key == 'w')
                    y -= 40;
                if(event.key == 's')
                    y += 40;
                $(".div0").css({
                    "transform" : "translate("+x+"px,"+y+"px)",
                    "transition" : "transform 0.5s"
                });
            });
        });
    </script>
</head>
<body>
    <div class="div0" style="background-color: red;width: 300px;height: 200px;border: 5px solid black;">
    </div>
    <div class="div1">
        <button class="but">^W</button>
        <div class="rl">
            <button class="but">A<</button>
            <button class="but">>D</button>
        </div>
        <button class="but">VS</button>
    </div>
</body>
<script src="5qur.js" ></script>
</html>
